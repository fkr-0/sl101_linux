# Meson cross file for the prepared Debian ARMHF glibc sysroot.
# Run scripts/build-armhf.sh to set sysroot and exclusive pkg-config search paths.
# This file intentionally contains no device, chroot, deploy or GPU instructions.
[binaries]
c = 'arm-linux-gnueabihf-gcc'
ar = 'arm-linux-gnueabihf-ar'
strip = 'arm-linux-gnueabihf-strip'
pkg-config = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'

[built-in options]
c_args = ['-march=armv7-a', '-mfpu=vfpv3-d16', '-mfloat-abi=hard', '-fno-tree-vectorize']
c_link_args = ['-march=armv7-a', '-mfpu=vfpv3-d16', '-mfloat-abi=hard']
