version: 1
name: sl101_linux
description: ASUS SL101 Linux kernel, Grate graphics, Nura bring-up, browsers and hardware qualification.
default_track: local
shell: true
sync_dir: ["."]
env:
  PYTHONPATH: src
commands:
  test:
    description: Run SL101 unit tests without hardware mutation
    category: test
    cwd: .
    run: ["make", "test"]
  check:
    description: Check Python syntax
    category: custom
    cwd: .
    run: ["make", "check"]
agent_workflow:
  version: '1.0'
  project:
    id: sl101_linux
    title: SL101 Linux
    root: .
    capacity:
      max_active_workers: 4
      max_reserved_packets: 8
      max_reviewers: 2
  defaults:
    queue: managed
    lease_policy: normal
    mutation_policy: transactional
    review_policy: independent-review
    priority: 50
  lease_policies:
    normal: {}
  mutation_policies:
    transactional:
      mode: transaction-required
      stale_write_protection: sha256
      capture_preimage: true
      rollback_on_partial_failure: true
  review_policies:
    independent-review:
      mode: required
      reviewer:
        independent: true
        allow_author: false
        allow_mutation: false
      max_rounds: 2
      on_timeout: blocked
  queues:
    managed:
      title: Managed work
      capacity: 4
  opportunities: []
  governance:
    strict_validation: true
    reject_unknown_fields: true
