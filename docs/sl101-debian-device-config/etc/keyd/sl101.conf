[ids]
0001:0002

[main]
capslock = layer(control)
# Preserve standard Ctrl behavior but distinguish physical LeftCtrl.
leftcontrol = layer(sl101_lctrl)
# SL101 physical RightAlt is the workstation's AltGr layer.
rightalt = layer(altgr)

[altgr:G]
w = G-102nd
e = 102nd
r = S-102nd
j = kprightparen
d = G-8
s = G-7
k = G-9
l = G-0
f = kpleftparen
, = 102nd
. = S-102nd
m = G-102nd
/ = S-7
right = end
left = home

# Super is reserved for Sway workspaces. Use physical RightAlt/AltGr
# + LeftCtrl + 1..9 for Ctrl+Alt+F1..F9 on graphical and text VTs.
[sl101_lctrl:C]

[sl101_lctrl+altgr]
1 = C-A-f1
2 = C-A-f2
3 = C-A-f3
4 = C-A-f4
5 = C-A-f5
6 = C-A-f6
7 = C-A-f7
8 = C-A-f8
9 = C-A-f9
