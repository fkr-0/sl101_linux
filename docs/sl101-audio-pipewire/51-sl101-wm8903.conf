# Keep the known-good WM8903 playback PCM fixed at 44.1 kHz.
# The current SL101 capture path rejects open/start and causes WirePlumber to
# repeatedly recover the whole ALSA device, so do not create that source node.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.platform-sound.pro-output-0" }
    ]
    actions = {
      update-props = {
        audio.rate = 44100
        audio.allowed-rates = [ 44100 ]
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_input.platform-sound.pro-input-0" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
